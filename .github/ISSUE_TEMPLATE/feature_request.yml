name: Feature Request
description: Suggest a feature for Dev Browser
labels: ["type: feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or features have you considered?
  - type: dropdown
    id: help
    attributes:
      label: Can you help implement this?
      options:
        - Yes
        - No
        - Maybe
    validations:
      required: true
